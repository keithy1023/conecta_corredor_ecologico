
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Corredor</title>

    <style>
        :root {
            --fondo: #180d2c;
            --fondo-claro: #35174e;
            --rosado: #e879f9;
            --morado: #a855f7;
            --texto: #fff8ff;
            --secundario: #e4d4ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 65px 24px;
            overflow-x: hidden;
            position: relative;
            color: var(--texto);

            background:
                radial-gradient(
                    ellipse at 85% 35%,
                    #6c2776 0%,
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 8% 90%,
                    #61276f 0%,
                    transparent 43%
                ),
                linear-gradient(
                    135deg,
                    #1b0e32,
                    #25113c 55%,
                    #180d2c
                );
        }

        /* LUCES DEL FONDO */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            left: -230px;
            top: -230px;
            background: #dd55e735;
            filter: blur(110px);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            right: -200px;
            bottom: -200px;
            background: #a855f730;
            filter: blur(100px);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ONDAS DECORATIVAS */
        .ondas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .onda-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 190px;
        }

        .onda-inferior {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 240px;
        }

        /* TARJETA PRINCIPAL */
        .contenedor {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1150px;
            min-height: 530px;
            padding: 65px 55px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 25px;

            background: linear-gradient(
                125deg,
                rgba(42, 30, 68, 0.96),
                rgba(48, 26, 67, 0.92)
            );

            border: 2px solid #c65de0;
            border-radius: 45px;

            box-shadow:
                0 25px 70px #09041270,
                0 0 35px #d946ef20,
                inset 0 1px 25px #ffffff08;

            backdrop-filter: blur(18px);
        }

        /* INFORMACION */
        .contenido {
            position: relative;
            z-index: 2;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 17px;
            margin-bottom: 22px;
        }

        .icono {
            font-size: 54px;
            line-height: 1;
            filter: drop-shadow(0 0 12px #e879f955);
        }

        h1 {
            color: #ffffff;
            font-size: clamp(30px, 3.5vw, 47px);
            font-weight: 800;
            letter-spacing: -1.5px;
            white-space: nowrap;
        }

        h1 span {
            color: #e879f9;
        }

        .decoracion {
            width: 160px;
            height: 6px;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #b44bef,
                #ef76df
            );
            margin-bottom: 45px;
            box-shadow: 0 0 18px #e879f955;
        }

        h2 {
            font-size: clamp(24px, 2.5vw, 34px);
            font-weight: 800;
            color: #fff8ff;
            line-height: 1.3;
            margin-bottom: 22px;
        }

        p {
            color: var(--secundario);
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 42px;
            max-width: 580px;
        }

        /* BOTONES */
        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .botones a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            min-height: 60px;
            padding: 16px 25px;

            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: 0.3s;
        }

        .login {
            color: white;
            background: linear-gradient(
                115deg,
                #9636e7,
                #e447cc
            );
            border: 2px solid transparent;
            box-shadow: 0 8px 25px #a855f735;
        }

        .login:hover {
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px #e879f955;
        }

        .registro {
            color: #fff0ff;
            background: rgba(40, 21, 58, 0.65);
            border: 2px solid #e879f9;
        }

        .registro:hover {
            color: white;
            background: #a855f730;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px #e879f930;
        }

        .botones svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ILUSTRACION */
        .ilustracion {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ilustracion svg {
            width: 100%;
            max-width: 460px;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 18px 24px #10091c55);
        }

        /* ANIMACIONES */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contenedor {
            animation: aparecer 0.8s ease both;
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-9px);
            }
        }

        .ilustracion {
            animation: flotar 6s ease-in-out infinite;
        }

        /* RESPONSIVE */
        @media (max-width: 950px) {
            .contenedor {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 48px 30px;
                gap: 30px;
            }

            .marca {
                justify-content: center;
            }

            .decoracion {
                margin-left: auto;
                margin-right: auto;
                margin-bottom: 30px;
            }

            p {
                margin-left: auto;
                margin-right: auto;
            }

            .botones {
                justify-content: center;
            }

            .ilustracion svg {
                max-width: 380px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 25px 14px;
            }

            .contenedor {
                border-radius: 28px;
                padding: 38px 22px;
            }

            .marca {
                gap: 10px;
            }

            .icono {
                font-size: 38px;
            }

            h1 {
                font-size: 27px;
                letter-spacing: -0.7px;
            }

            h2 {
                font-size: 23px;
            }

            p {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .botones {
                flex-direction: column;
            }

            .botones a {
                width: 100%;
            }

            .ilustracion svg {
                max-width: 290px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .contenedor,
            .ilustracion {
                animation: none;
            }

            .botones a {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- ONDAS DEL FONDO -->
    <div class="ondas" aria-hidden="true">

        <svg class="onda-superior"

            <path

                        <circle cx="12" cy="7" r="4"/>

                <!-- ARBOLES DEL FONDO -->
